name: ci-appengine

on:
  push:
    branches-ignore:
      - 'v2**'
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_name }}
  PDF_FILE: 'LOUVET_Celine'
  BUCKET_NAME: '${{ vars.GCP_PROJECT }}.appspot.com'

jobs:
  deploy:
    name: Deploy
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: yarn install

      - name: Clean
        run: yarn clean

      - name: Build packages
        run: |
          yarn turbo @repo/eslint-config#build
          yarn turbo @repo/jest-presets#build
          yarn turbo @repo/typescript-config#build
          yarn turbo @repo/models#build

      - name: Build apps
        run: |
          yarn turbo api#build
          yarn turbo website#build

      - name: Typechecks
        run: yarn typecheck

      - name: Lint code and types
        run: yarn lint

      - id: deploy
        name: Deploy to GCP AppEngine
        uses: ./.github/actions/turbo-deploy-gae
        with:
          apps_directory: apps
          target_app: website
          env: staging
          test_endpoint: /test
          gcloud_project_id: ${{ vars.GCP_PROJECT }}
          gcloud_credentials_json: ${{ secrets.GCP_SA_KEY }}
          should_promote: false

    outputs:
      versionUrl: ${{ steps.deploy.outputs.version_url }}

