name: cd-appengine

on:
  push:
    branches:
      - 'v2**'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_name }}
  PDF_FILE: 'LOUVET_Celine'
  BUCKET_NAME: '${{ vars.GCP_PROJECT }}.appspot.com'

jobs:
  deploy:
    name: Deploy
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm install

      - name: Clean
        run: npm run clean

      - name: Build packages
        run: |
          npx turbo @repo/eslint-config#build
          npx turbo @repo/jest-presets#build
          npx turbo @repo/typescript-config#build
          npx turbo @repo/models#build

      - name: Build apps
        run: |
          npx turbo api#build
          npx turbo website#build

      - name: Typechecks
        run: npm run typecheck

      - name: Lint code and types
        run: npm run lint

      - id: deploy
        name: Deploy to GCP AppEngine
        uses: ./.github/actions/turbo-deploy-gae
        with:
          apps_directory: apps
          target_app: website
          env: prod
          test_endpoint: /test
          gcloud_project_id: ${{ vars.GCP_PROJECT }}
          gcloud_credentials_json: ${{ secrets.GCP_SA_KEY }}
          should_promote: false

    outputs:
      versionUrl: ${{ steps.deploy.outputs.version_url }}

  slidePdf:
    name: Generate Slides PDF
    needs: deploy
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Define bucket path
        id: bucket
        run: echo "BUCKET_PATH=${{env.BUCKET_NAME}}/slides" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-

      - name: Generate PDF
        shell: bash
        run: cd slides-generator && npm run && npm run slides --pageUrl "$VERSION_URL"
        env:
          VERSION_URL: ${{ needs.deploy.outputs.versionUrl }}

      - id: auth
        name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Upload Slides PDF
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: './slides-generator/Highway_to_fail.pdf'
          destination: ${{ steps.bucket.outputs.BUCKET_PATH }}
          predefinedAcl: publicRead

      - name: Upload Notes PDF
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: './slides-generator/Notes_-_Highway_to_fail.pdf'
          destination: ${{ steps.bucket.outputs.BUCKET_PATH }}
          predefinedAcl: publicRead
